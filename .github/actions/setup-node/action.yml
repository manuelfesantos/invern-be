name: "Setup Node & install"
description: "Checks out already done by caller; sets up Node 20 and runs npm ci (with npm cache)."
runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: "npm"
    - name: Install dependencies
      shell: bash
      run: npm ci
