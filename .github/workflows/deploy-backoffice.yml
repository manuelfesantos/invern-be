name: Deploy Backoffice

# Per-app deploy for apps/backoffice → Cloudflare Workers static assets.
# Fires after a merge to preview (staging) or main (production). The build bakes
# in VITE_API_BASE_URL per environment.
#
# Requires repo secrets (provisioned by the operator — see feature 24):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   VITE_API_BASE_URL_PREVIEW, VITE_API_BASE_URL_PRODUCTION
on:
  push:
    branches: [preview, main]
    paths:
      - "apps/backoffice/**"
      - "packages/api-client/**"
      - "swagger.yaml"

jobs:
  deploy:
    name: Build & Deploy Backoffice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - name: Build
        working-directory: apps/backoffice
        env:
          VITE_API_BASE_URL: ${{ github.ref_name == 'main' && secrets.VITE_API_BASE_URL_PRODUCTION || secrets.VITE_API_BASE_URL_PREVIEW }}
        run: npm run build
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backoffice
          command: deploy
