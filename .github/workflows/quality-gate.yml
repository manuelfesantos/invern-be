name: Quality Gate

# Reusable gate: lint + test + type-check. Called by the PR-to-preview and
# PR-to-main workflows so the two can never drift apart.
on:
  workflow_call:

jobs:
  lint:
    name: Run Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Linter
        run: npm run lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Tests
        run: npm run test

  typecheck:
    name: Run Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Type Check (libs + scripts + tests)
        run: npm run type-check
      - name: Run Type Check (apps via Turbo)
        run: npm run type-check:apps

  openapi:
    name: Check OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Validates swagger.yaml (OpenAPI validator) and fails if the documented
      # paths/methods drift from the real Hono route inventory.
      - name: Validate & freshness-check swagger.yaml
        run: npm run openapi:check
      # Fails if the committed generated client is stale vs swagger.yaml, so a
      # spec change and its regenerated client must land in the same PR.
      - name: Freshness-check the generated api-client
        run: npm run api-client:check
