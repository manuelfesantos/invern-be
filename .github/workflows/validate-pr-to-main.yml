name: Validate PR to Main

on:
  pull_request:
    branches:
      - main

# Minimal permissions: the source-branch check only reads PR metadata.
permissions:
  contents: read

jobs:
  validate-source-branch:
    name: Validate PR source branch
    runs-on: ubuntu-latest
    steps:
      - name: Require the source branch to be 'preview'
        run: |
          if [[ "${{ github.event.pull_request.head.ref }}" != "preview" ]]; then
            echo "::error::PRs into 'main' must come from the 'preview' branch (got '${{ github.event.pull_request.head.ref }}')."
            exit 1
          fi
          echo "PR source branch is 'preview' — ok."

  quality-gate:
    # Only run the (more expensive) gate once the promotion flow is valid.
    needs: validate-source-branch
    # lint + test + type-check (shared with validate-pr-to-preview)
    uses: ./.github/workflows/quality-gate.yml
