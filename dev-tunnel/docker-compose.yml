# Exposure layer for the local dev server: puts the backoffice (Vite, host :5173)
# behind Google login (only the allow-listed email) and tunnels it to a stable
# public hostname. The dev servers stay on the HOST (wrangler + Vite) — only this
# auth+tunnel layer runs in Docker.
#
#   phone -> cloudflared -> oauth2-proxy -> host Vite :5173 -> /api -> host wrangler :8790
#
# Fill in dev-tunnel/.env first (see .env.example + README.md), then:
#   docker compose -f dev-tunnel/docker-compose.yml up -d
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    restart: unless-stopped
    command:
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      - --provider=google
      - --client-id=${OAUTH2_PROXY_CLIENT_ID}
      - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --redirect-url=https://${DEV_HOSTNAME}/oauth2/callback
      - --authenticated-emails-file=/etc/oauth2-proxy/emails.txt
      - --upstream=http://host.docker.internal:5173
      - --cookie-secure=true
      - --cookie-domain=${DEV_HOSTNAME}
      - --whitelist-domain=${DEV_HOSTNAME}
      - --skip-provider-button=true
      - --pass-host-header=true
    volumes:
      - ./authenticated-emails.txt:/etc/oauth2-proxy/emails.txt:ro
    extra_hosts:
      # so oauth2-proxy can reach the host's Vite on Linux (macOS/Win provide it)
      - "host.docker.internal:host-gateway"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Token from the Cloudflare Zero Trust tunnel (see README). The public
      # hostname -> http://oauth2-proxy:4180 mapping is configured in the dashboard.
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - oauth2-proxy
