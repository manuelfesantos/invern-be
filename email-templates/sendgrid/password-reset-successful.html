<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>Password Reset Confirmation</title>
</head>

<body style="margin:0!important;padding:0!important;width:100%!important;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse!important;">
    <tr>
        <td align="center">
            <table width="100%" cellpadding="0" cellspacing="0"
                   style="width:100%;max-width:600px;margin:0 auto;border-collapse:collapse!important;">
                <!-- Header -->
                <tr>
                    <td align="center" style="background-color:#18222d;padding:20px;">
                        <img
                                src="{{brand_logo_url}}"
                                alt="{{brand_name}} Logo"
                                style="border:0;height:auto;line-height:100%;outline:none;text-decoration:none;max-width:150px;"
                        />
                    </td>
                </tr>

                <!-- Body -->
                <tr>
                    <td style="background-color:#ffffff;padding:30px;font-family:Arial, sans-serif;color:#333333;">
                        <p style="font-size:18px;margin:0 0 20px 0;">
                            Hi {{customer_first_name}},
                        </p>
                        <p style="font-size:16px;margin:0 0 20px 0;">
                            Your password has been successfully updated. You can now log in using your new password.
                        </p>

                        <!-- Call to Action -->
                        <div style="text-align:center;margin:30px 0;">
                            <a
                                href="{{login_url}}"
                                style="display:inline-block;padding:12px 24px;background-color:#18222d;color:#ffffff;text-decoration:none;border-radius:4px;font-size:16px;"
                            >Log In Now</a>
                        </div>

                        <p style="font-size:16px;margin:0 0 20px 0;">
                            If you did not make this change, please contact our support team immediately at
                            <a href="mailto:{{support_email}}" style="color:#1a73e8;text-decoration:underline;">{{support_email}}</a>.
                        </p>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td align="center"
                        style="background-color:#fafafa;padding:20px;font-size:12px;color:#888888;font-family:Arial, sans-serif;">
                        <p style="margin:0 0 5px 0;">{{brand_name}} • {{brand_address}}</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
