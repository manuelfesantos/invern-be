      - AdminBearer: []
    parameters:
      - name: code
        in: path
        required: true
        description: ISO 2-letter country code (e.g., PT, ES).
        schema:
          type: string
          example: PT
    get:
      tags:
        - Private - Countries
      summary: Get Country by Code (Admin)
      description: Retrieves details for a specific country. Requires Admin Authentication.
      responses:
        '200':
          description: Country details.
          content:
            application/json:
