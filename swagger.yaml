              type: integer
              format: int32
              description: Total price including items, taxes, and shipping (in cents).
            accessToken:
              type: string
      required:
        - message
        - data
    CheckoutStageResponsePaymentGet:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            url:
              type: string
              format: url
              description: The URL to redirect the user to Stripe Checkout.
            accessToken:
              type: string
      required:
        - message
        - data

    # --- Shipping ---
    ShippingRate:
      type: object
      properties:
        priceInCents:
          type: integer
          format: int32
        minWeight:
          type: integer
          format: int32
        maxWeight:
          type: integer
          format: int32
        deliveryTime:
          type: integer
          format: int32
          description: Estimated delivery time in business days.
        countryCodes:
          type: array
          items:
            type: string
            example: PT
            pattern: '^[A-Z]{2}$'
    BaseShippingMethod:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
    SelectedShippingMethod: # Shipping method with the applicable rate selected
      allOf:
        - $ref: '#/components/schemas/BaseShippingMethod'
        - type: object
          properties:
            rate:
              $ref: '#/components/schemas/ShippingRate'
      required:
        - rate

    # --- Payment / Order ---
    PaymentMethod: # Info about the payment method used
      type: object
      properties:
        type:
          type: string
          enum: [card, paypal]
        brand:
          type: string
          nullable: true
          example: visa
        last4:
          type: string
          nullable: true
          example: '4242'
    ClientPayment: # Payment details shown to the client
      type: object
      properties:
        state:
          type: string
          enum: [draft, succeeded, canceled, created, processing, failed]
        netAmount:
          type: integer
          format: int32
          description: Amount before taxes (might be null if not applicable/available).
          nullable: true
        grossAmount:
          type: integer
          format: int32
          description: Total amount paid.
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
          nullable: true
    ShippingTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [processing, shipped, delivered, canceled]
        trackingUrl:
          type: string
          format: url
          nullable: true
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
    ClientOrder: # Order structure returned to the client
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
        products:
          type: array
          items:
            $ref: '#/components/schemas/LineItem' # Basic line item info
        address:
          $ref: '#/components/schemas/Address'
        personalDetails:
          $ref: '#/components/schemas/UserDetails'
        shippingMethod:
          $ref: '#/components/schemas/SelectedShippingMethod'
        payment:
          $ref: '#/components/schemas/ClientPayment'
          nullable: true
        shippingTransaction:
          $ref: '#/components/schemas/ShippingTransaction'
        isCanceled:
          type: boolean
          nullable: true # Might be null before explicitly set
      required:
        - id
        - createdAt
        - lastModifiedAt
        - products
        - address
        - personalDetails
        - shippingMethod
        - shippingTransaction
    ExtendedClientOrder: # Order structure with calculated fields (taxes, totals, status)
      allOf:
        - $ref: '#/components/schemas/ClientOrder'
        - type: object
          properties:
            products: # Override with extended items including calculated prices/taxes
              type: array
              items:
                $ref: '#/components/schemas/ExtendedLineItem'
            taxes: # Aggregated taxes for the order
              type: array
              items:
                $ref: '#/components/schemas/ExtendedClientTax'
            currency:
              $ref: '#/components/schemas/ClientCurrency'
            status: # Calculated overall order status
              type: string
              enum: [processing_payment, packaging, shipping, completed, canceled, error]
              description: Calculated order status based on payment and shipping states.
      required:
        - products
        - taxes
        - currency
        - status
    Order: # Full internal order representation (includes internal IDs like userId, paymentId, etc.)
      allOf:
        - $ref: '#/components/schemas/ClientOrder' # Base client view
        - type: object
          properties:
            userId:
              type: string
              format: uuid
              nullable: true
            paymentId:
              type: string
              format: uuid # Assuming internal payment ID is UUID
              nullable: true
            stripeId: # The Stripe Checkout Session ID
              type: string
              example: cs_...
            isCanceled:
              type: boolean
              nullable: true # Explicitly defining as nullable
      required:
        - stripeId
    UpdateAdminOrderInput:
      type: object
      description: Fields that can be updated on an order by an admin.
      properties:
        # Add fields that make sense for admin update, e.g., shipping status, notes
        # Example:
        # shippingTransactionId:
        #   type: string
        #   format: uuid
        #   description: Update the associated shipping transaction.
        isCanceled:
          type: boolean
          description: Explicitly mark the order as canceled (use /cancel endpoint for state change logic).
      # Add other updatable fields as needed
    GetUserOrdersResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            orders:
              type: array
              items:
                $ref: '#/components/schemas/ExtendedClientOrder'
            accessToken:
              type: string
      required:
        - message
        - data
    GetOrderResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            order:
              $ref: '#/components/schemas/ExtendedClientOrder'
            accessToken:
              type: string
      required:
        - message
        - data

    # ---------- OAuth Schemas ----------
    OAuthRedirectResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            url:
              type: string
              format: url
              description: URL to redirect the user to Google.
      required:
        - message
        - data
    OAuthCallbackResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            accessToken:
              type: string
      required:
        - message
        - data

    # ---------- Stripe Schemas ----------
    StripeEvent:
      type: object
      description: Generic structure for a Stripe webhook event. The `data.object` type varies.
      properties:
        id:
          type: string
          description: Stripe event ID.
        object:
          type: string
          enum: [event]
        api_version:
          type: string
        created:
          type: integer
          format: int64
          description: Timestamp of event creation (Unix epoch seconds).
        data:
          type: object
          properties:
            object:
              type: object
              description: The actual Stripe object related to the event (e.g., PaymentIntent, CheckoutSession). Varies by event type.
        livemode:
          type: boolean
        pending_webhooks:
          type: integer
        request:
          type: object
          nullable: true
          properties:
            id:
              type: string
              nullable: true
            idempotency_key:
              type: string
              nullable: true
        type:
          type: string
          description: The type of event (e.g., 'checkout.session.completed', 'payment_intent.succeeded').
      required:
        - id
        - object
        - created
        - data
        - livemode
        - type

  securitySchemes:
    AdminBearer: # Real admin auth: JWT access token + refresh cookie
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Admin access token (JWT) sent as `Authorization: Bearer <token>`. The
        token must carry `role: ADMIN`, enforced by
        `functions/private/_middleware.ts`. The refresh-token cookie (`s_r`)
        must also be present on the request — `getCredentials` requires both the
        access token and the refresh token. Obtain both by logging in
        (`POST /public/countries/{countryCode}/user/login`) as an ADMIN user.
        The maintenance route `stock/setup` instead validates a `secretKey`
        field in its request body and is not covered by this scheme.

  responses:
    BadRequest:
      description: Bad Request - Invalid input data, parameters, or request format. Check `issues` for details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Authentication required or invalid credentials/token/secret key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Access denied, insufficient permissions, or operation not allowed in current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not Found - The requested resource could not be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict - The request could not be completed due to a conflict with the current state of the resource (e.g., email already exists, order already processed).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal Server Error - An unexpected error occurred on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CheckoutStageNotEnabled:
      description: Bad Request - The requested checkout stage is not currently enabled or accessible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CheckoutStageErrorResponse'
    CheckoutStageNotEnabledOrBadRequest: # Combines stage errors with other potential 400s
      description: Bad Request - Either the stage is not enabled, or the input data is invalid (e.g., address mismatch, invalid rate). See `issues` for details.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/CheckoutStageErrorResponse'
              - $ref: '#/components/schemas/ErrorResponse'

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: 1-based page number for admin list endpoints (default 1).
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: Items per page for admin list endpoints (default 10, max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    SortOrderParam:
      name: sortOrder
      in: query
      required: false
      description: >-
        Sort direction for admin list endpoints. Only applied when `sortBy` is
        set. Defaults to ascending.
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    CountryCode:
      name: countryCode
      in: path
      required: true
      description: ISO 2-letter country code (uppercase, e.g., PT, ES).
      schema:
        type: string
        pattern: '^[A-Z]{2}$'
        example: PT
    ProductId:
      name: id
      in: path
      required: true
      description: The unique identifier (UUID) of the product.
      schema:
        type: string
        format: uuid
        example: nPn6WYEMz1NK2B61hmrWsb
    CollectionId:
      name: id
      in: path
      required: true
      description: The unique identifier (UUID) of the collection.
      schema:
        type: string
        format: uuid
        example: 9bekuxMKGrRTKvZqNYZdDV
    CartId: # Added
      name: id
      in: path
      required: true
      description: The unique identifier (UUID) of the cart.
      schema:
        type: string
        format: uuid
    UserId: # Added
      name: id
      in: path
      required: true
      description: The unique identifier (UUID) of the user.
      schema:
        type: string
        format: uuid
    OrderId:
      name: id
      in: path
      required: true
      description: The unique identifier (UUID) of the order.
      schema:
        type: string
        format: uuid
        example: w3ChBD7SjeReRrNSwSSsa3
    SearchQuery: # Added
      name: search
      in: query
      required: false
      description: Optional search term to filter results by name or description.
      schema:
        type: string
    PageQuery: # Added
      name: page
      in: query
      required: false
      description: Page number for pagination (default 1).
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSizeQuery: # Added
      name: pageSize
      in: query
      required: false
      description: Number of items per page (default 10).
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100 # Example max, adjust as needed
        default: 10

  headers:
    SetCookieAuth: # For Login, Signup Validation, OAuth Callback
      description: Sets `s_r` (refresh token, HttpOnly, Secure, SameSite=Strict) and optionally `r_m` (remember me, Secure, SameSite=Strict) if remember=true. Deletes `c_i`, `a_d`, `u_d`, `s_m`, `c_s`, `c_m`.
      schema:
        type: string
    SetCookieAuthAndOAuthDelete: # For OAuth Callback specifically
      description: Sets `s_r` and `r_m`. Deletes `o_t`, `c_i`, `a_d`, `u_d`, `s_m`, `c_s`, `c_m`.
      schema:
        type: string
    SetCookieLogout: # For Logout, Delete User
      description: Deletes `s_r` and `r_m`. Sets a new anonymous `s_r` token. Deletes checkout cookies (`a_d`, `u_d`, `s_m`, `c_s`, `c_m`).
      schema:
        type: string
    SetCookieAnonymous: # For Signup Init, Forgot Password Submit/Reset/Validate
      description: Sets a new anonymous `s_r` token. May delete other cookies like `c_i`, checkout cookies.
      schema:
        type: string
    SetCookieOptional: # For general authenticated endpoints GET /config, GET /cart, etc.
      description: May refresh the `s_r` cookie (refresh token) and/or `c_i` cookie (cart ID).
      schema:
        type: string
    SetCookieOptionalOrCustomerEmail: # For GET /orders/{id}
      description: May refresh `s_r` cookie. May set `c_m` (encrypted customer email) if guest lookup via header was successful.
      schema:
        type: string
    SetCookiePersonalDetails: # For POST /checkout/stages/personal-details
      description: Sets `u_d` (encrypted user details) cookie. May refresh `s_r`.
      schema:
        type: string
    SetCookieAddress: # For POST /checkout/stages/address
      description: Sets `a_d` (encrypted address) cookie. May refresh `s_r`.
      schema:
        type: string
    SetCookieShipping: # For POST /checkout/stages/shipping
      description: Sets `s_m` (encrypted shipping method ID) cookie. May refresh `s_r`.
      schema:
        type: string
    SetCookieCheckoutSession: # For GET /checkout/stages/payment
      description: Sets `c_s` (encrypted Stripe checkout session ID) cookie. May refresh `s_r`.
      schema:
        type: string
    SetCookieOAuthToken: # For GET /oauth/google/redirect
      description: Sets `o_t` (OAuth state token) cookie (HttpOnly, Secure, SameSite=Lax).
      schema:
        type: string