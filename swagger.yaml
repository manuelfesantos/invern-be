    CheckoutStageResponseShippingGet:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            shippingMethods:
              type: array
              items:
                $ref: '#/components/schemas/SelectedShippingMethod'
            selectedShippingMethod:
              $ref: '#/components/schemas/SelectedShippingMethod'
              nullable: true
            availableCheckoutStages:
              type: array
              items:
                $ref: '#/components/schemas/ClientCheckoutStage'
            accessToken:
              type: string
      required:
        - message
        - data
    CheckoutStageResponseShippingPost:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            shippingMethod:
              $ref: '#/components/schemas/SelectedShippingMethod'
            availableCheckoutStages:
              type: array
              items:
                $ref: '#/components/schemas/ClientCheckoutStage'
            accessToken:
              type: string
      required:
        - message
        - data
    CheckoutStageReviewItem: # Structure for review items (with edit status)
      properties:
        isEditable:
          type: boolean
