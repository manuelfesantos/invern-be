  # -------------------- Stripe Webhooks --------------------
  /stripe/session-result:
    post:
      tags:
        - Stripe Webhooks
      summary: Handle Stripe Checkout Session Events
      description: Webhook endpoint to receive `checkout.session.completed` and `checkout.session.expired` events from Stripe. Creates orders or handles expiration logic (releasing stock). Verifies Stripe signature (assumed handled by middleware or infrastructure). Ignores events not matching the configured `STRIPE_ENV`.
      requestBody:
        required: true
        description: Stripe Event object (`checkout.session.completed` or `checkout.session.expired`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeEvent' # Generic Stripe event, specific type checked internally
      responses:
        '200':
          description: Event received and processed successfully. Returns created order data for completed sessions, or success message for expired/ignored sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success getting checkout-session # Or 'checkout session already expired', 'Unsupported event...'
                  data: # Only present for newly created order on completed session
                    $ref: '#/components/schemas/ClientOrder'
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid payload or event type, or Stripe signature validation failure
        '409':
          description: Conflict - Order already exists for this session ID (race condition).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /stripe/payment-intent:
    post:
      tags:
        - Stripe Webhooks
      summary: Handle Stripe Payment Intent Events
      description: Webhook endpoint to receive Payment Intent events from Stripe (`created`, `succeeded`, `processing`, `canceled`, `failed`). Updates payment status in the database. Verifies Stripe signature (assumed handled by middleware or infrastructure). Ignores events not matching the configured `STRIPE_ENV`.
      requestBody:
        required: true
        description: Stripe Event object (Payment Intent related types).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeEvent' # Generic Stripe event, specific type checked internally
      responses:
        '200':
          description: Event received and processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success getting checkout-session # Message might vary
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid payload, event type, or Stripe signature validation failure
        '409':
          description: Conflict - Payment already exists in a final state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    # ---------- Pagination ----------
    # Shared admin-list envelope. A list endpoint's `data` is an object shaped as
    # `allOf: [PaginationMeta, { data: <array of entity> }]`, i.e.
    # `{ data: [...], page, pageSize, total }`.
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        total:
          type: integer
          description: Total rows across all pages.
          example: 137
    # ---------- Basic Entities ----------
    ErrorResponse:
      type: object
      properties:
        issues:
          type: array
          items:
            type: string
          example: ["Invalid username or password"]
    SuccessData: # Often includes accessToken
      type: object
      description: Placeholder for successful response data structure.
      properties:
        accessToken:
          type: string
          description: JWT access token (present in most authenticated responses).
    SuccessResponse: # Basic success structure
      type: object
      properties:
        message:
          type: string
          description: A human-readable message indicating the result of the operation.
        data: # Optional data payload
          nullable: true
          oneOf:
            - type: object
            - type: array
            - type: string
            - type: number
            - type: boolean
    SecretKeyInput:
      type: object
      properties:
        secretKey:
          type: string
          description: Secret key required for authorization.
      required:
        - secretKey

    # --- Country/Currency/Tax ---
    ClientCurrency:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
          example: EUR
          pattern: '^[A-Z]{3}$'
        symbol:
          type: string
          example: €
        stripeName:
          type: string
          example: eur
    Currency: # Full currency details including rate
      allOf:
        - $ref: '#/components/schemas/ClientCurrency'
        - type: object
          properties:
            rateToEuro:
              type: number
              format: float
              description: Exchange rate relative to EUR (1 EUR = X rateToEuro).
            createdAt:
              type: string
              format: date-time
            lastModifiedAt:
              type: string
              format: date-time
    InsertCurrency: # Schema for POST/PUT /private/currencies
      type: object
      properties:
        name:
          type: string
        code:
          type: string
          example: USD
          pattern: '^[A-Z]{3}$'
        symbol:
          type: string
          example: $
        rateToEuro:
          type: number
          format: float
        stripeName:
          type: string
          example: usd
      required:
        - name
        - code
        - symbol
        - rateToEuro
        - stripeName
    ClientTax:
      type: object
      properties:
        name:
          type: string
        rate:
          type: number
          format: float # e.g., 0.23 for 23%
    Tax: # Full tax details including Stripe ID
      allOf:
        - $ref: '#/components/schemas/ClientTax'
        - type: object
          properties:
            id:
              type: string
              description: Stripe Tax Rate ID.
              example: txr_...
            createdAt:
              type: string
              format: date-time
            lastModifiedAt:
              type: string
              format: date-time
    ExtendedClientTax: # Tax with calculated amount
      allOf:
        - $ref: '#/components/schemas/ClientTax'
        - type: object
          properties:
            amount:
              type: integer
              format: int32
              description: Calculated tax amount in cents for a given price.
    ClientCountry: # Used for public listing
      type: object
      properties:
        name:
          type: string
        code:
          type: string
          example: PT
          pattern: '^[A-Z]{2}$'
        locale:
          type: string
          example: pt-PT
        currency:
          $ref: '#/components/schemas/ClientCurrency'
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/ClientTax'
    Country: # Full country details including full Tax info and dates
      allOf:
        - $ref: '#/components/schemas/ClientCountry'
        - type: object
          properties:
            taxes: # Override with full Tax schema
              type: array
              items:
                $ref: '#/components/schemas/Tax'
            createdAt:
              type: string
              format: date-time
            lastModifiedAt:
              type: string
              format: date-time
    InsertCountry: # Schema for POST/PUT /private/countries
      type: object
      properties:
        name:
          type: string
        code:
          type: string
          pattern: '^[A-Z]{2}$'
        locale:
          type: string
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
      required:
        - name
        - code
        - locale
        - currencyCode

    # --- Image ---
    ImageDTO: # Basic image info for lists/previews
      type: object
      properties:
        url:
          type: string
          format: url
        alt:
          type: string
    Image: # Full image details including dates
      allOf:
        - $ref: '#/components/schemas/ImageDTO'
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
            lastModifiedAt:
              type: string
              format: date-time

    # --- Product/Collection ---
    Product: # Core product data
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        priceInCents:
          type: integer
          format: int32
          description: Net price before tax.
        stock:
          type: integer
          format: int32
        weight:
          type: integer
          format: int32
          description: Weight in grams.
        images: # Array for list views, often limited to 1
          type: array
          items:
            $ref: '#/components/schemas/ImageDTO'
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
    InsertProduct: # Schema for POST/PUT /private/products
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        priceInCents:
          type: integer
          format: int32
        stock:
          type: integer
          format: int32
        weight:
          type: integer
          format: int32
        collectionId:
          type: string
          format: uuid
      required:
        - name
        - description
        - priceInCents
        - stock
        - weight
        - collectionId
    ExtendedProduct: # Product with calculated prices and taxes
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            netPrice:
              type: integer
              format: int32
              description: Price before tax (same as priceInCents).
            grossPrice:
              type: integer
              format: int32
              description: Price including tax.
            taxes:
              type: array
              items:
                $ref: '#/components/schemas/ExtendedClientTax'
          required:
            - netPrice
            - grossPrice
            - taxes
    ProductDetails: # Product with full details (description, all images)
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            description:
              type: string
            images: # Override Product images to use full Image schema array
              type: array
              items:
                $ref: '#/components/schemas/Image'
            collectionId:
              type: string
              format: uuid
      required:
        - description
        - collectionId
    ProductWithCollectionDetails: # Product details including linked collection name/ID
      allOf:
        - $ref: '#/components/schemas/ProductDetails'
        - type: object
          properties:
            collection:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
              required:
                - id
                - name
          required:
            - collection
    ExtendedProductWithCollectionDetails: # Full details + calculated prices/taxes
      allOf:
        - $ref: '#/components/schemas/ProductWithCollectionDetails'
        - $ref: '#/components/schemas/ExtendedProduct' # Inherit pricing fields
      required: # Ensure inherited required fields are listed if needed
        - netPrice
        - grossPrice
        - taxes
    Collection: # Collection info for lists
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        image:
          $ref: '#/components/schemas/Image' # Only one image shown in list view
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
    InsertCollection: # Schema for POST/PUT /private/collections
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required:
        - name
        - description
    CollectionDetails: # Full collection details with basic products
      allOf:
        - $ref: '#/components/schemas/Collection'
        - type: object
          properties:
            description:
              type: string
            products:
              type: array
              items:
                $ref: '#/components/schemas/Product'
      required:
        - description
        - products
    ExtendedCollectionDetails: # Full collection details with extended products (prices/taxes)
      allOf:
        - $ref: '#/components/schemas/CollectionDetails'
        - type: object
          properties:
            products: # Override products with extended version
              type: array
              items:
                $ref: '#/components/schemas/ExtendedProduct'
      required:
        - products

    # --- Cart ---
    LineItem: # Product within a cart context
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            quantity:
              type: integer
              format: int32
              minimum: 1 # Usually, items in cart have quantity >= 1
          required:
            - quantity
    LineItemError:
      type: object
      properties:
        message:
          type: string
        type:
          type: string
          enum: [NOT_ENOUGH_STOCK]
      required:
        - message
        - type
    ExtendedLineItem: # Line item with calculated prices/taxes and potential issues
      allOf:
        - $ref: '#/components/schemas/LineItem'
        - $ref: '#/components/schemas/ExtendedProduct' # Inherit pricing fields
        - type: object
          properties:
            issues:
              type: array
              items:
                $ref: '#/components/schemas/LineItemError'
      required: # Ensure inherited required fields are listed
        - netPrice
        - grossPrice
        - taxes
    CartDTO: # Basic structure of items in a cart
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
    Cart: # Full Cart object including metadata
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastModifiedAt:
          type: string
          format: date-time
        isLoggedIn:
          type: boolean
        products:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
    ExtendedCart: # Cart with calculated totals, taxes, and checkout status
      allOf:
        - $ref: '#/components/schemas/CartDTO'
        - type: object
          properties:
            products: # Override with extended line items
              type: array
              items:
                $ref: '#/components/schemas/ExtendedLineItem'
            netPrice:
              type: integer
              format: int32
              description: Total net price of all items in the cart.
            grossPrice:
              type: integer
              format: int32
              description: Total gross price of all items in the cart (including taxes).
            taxes: # Aggregated taxes for the whole cart
              type: array
              items:
                $ref: '#/components/schemas/ExtendedClientTax'
            isCheckoutPossible:
              type: boolean
              description: Indicates if checkout can proceed (e.g., cart not empty, no stock issues).
            issues:
              type: array
              items:
                type: string
              description: List of issues preventing checkout (e.g., 'Some products have issues').
      required:
        - products
        - netPrice
        - grossPrice
        - taxes
        - isCheckoutPossible
    CartItemQuantityInputPatch: # For PATCH /cart/items/{id}
      type: object
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1 # PATCH implies adding quantity > 0
          description: Quantity to add to the existing item quantity.
      required:
        - quantity
    CartItemQuantityInputPut: # For PUT /cart/items/{id}
      type: object
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 0 # PUT sets the exact quantity, 0 means remove.
          description: The exact quantity to set for the item. 0 removes the item.
      required:
        - quantity
    CartResponse: # Standard response format for cart operations
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            cart:
              $ref: '#/components/schemas/ExtendedCart'
            accessToken: # May include refreshed anonymous or logged-in token
              type: string
      required:
        - message
        - data

    # --- User / Address ---
    AddressInput: # Structure for providing address data
      type: object
      description: Address structure for input. Country is determined by the path parameter.
      properties:
        street:
          type: string
        houseNumber:
          type: string
        apartment:
          type: string
          nullable: true
        postalCode:
          type: string
        city:
          type: string
        province:
          type: string
          nullable: true
      required:
        - street
        - houseNumber
        - postalCode
        - city
    Address: # Full address structure including country code
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          properties:
            country:
              type: string
              description: ISO 2-letter country code.
              example: PT
              pattern: '^[A-Z]{2}$'
          required:
            - country
    UserDetailsInput: # Structure for providing user details (guest checkout)
      type: object
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
          nullable: true
      required:
        - email
        - firstName
    UserDetails: # User details without address
      allOf:
        - $ref: '#/components/schemas/UserDetailsInput'
    UserDTO: # Data returned about the user (excluding sensitive info like password, role, internal IDs)
      allOf:
        - $ref: '#/components/schemas/UserDetails'
        - type: object
          properties:
            address:
              $ref: '#/components/schemas/Address'
              nullable: true
    BaseUser: # Full user schema as stored in DB (excluding password hash)
      allOf:
        - $ref: '#/components/schemas/UserDTO'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            lastModifiedAt:
              type: string
              format: date-time
            version:
              type: integer
            role:
              type: string
              enum: [ADMIN, USER]
            isOauth:
              type: boolean
            googleUserId:
              type: string
              nullable: true
            isValidated:
              type: boolean
      required:
        - id
        - createdAt
        - lastModifiedAt
        - version
        - role
        - isOauth
        - isValidated
    GetUserResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserDTO'
            accessToken:
              type: string
      required:
        - message
        - data
    UpdateUserResponse: # Response after successful user update
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserDTO'
            accessToken:
              type: string
      required:
        - message
        - data
    DeleteUserResponse:
      type: object
      properties:
        message:
          type: string
        data: # Contains anonymous token
          $ref: '#/components/schemas/SuccessData'
      required:
        - message
        - data
    UpdatePersonalInformationInput:
      type: object
      description: Fields to update personal information. At least one property (firstName, lastName, or address) must be provided.
      properties:
        firstName:
          type: string
        lastName:
          type: string
        address:
          $ref: '#/components/schemas/AddressInput'
      minProperties: 1
    UpdatePasswordInput:
      type: object
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
      required:
        - currentPassword
        - newPassword
    SubmitEmailChangeInput:
      type: object
      properties:
        email:
          type: string
          format: email
          description: The new email address to change to.
      required:
        - email
    ValidateEmailChangeCodeInput:
      type: object
      properties:
        code:
          type: string
          description: The validation code received in the new email.
      required:
        - code

    # --- Auth / Config Responses ---
    AuthSuccessResponse: # Response for successful login/signup validation
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserDTO'
            cart:
              $ref: '#/components/schemas/ExtendedCart'
            accessToken:
              type: string
          required:
            - user
            - cart
            - accessToken
    LogoutResponse: # Response for successful logout
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            cart: # Represents an empty cart state after logout
              $ref: '#/components/schemas/ExtendedCart'
            accessToken: # New anonymous token
              type: string
          required:
            - cart
            - accessToken
    SignupResponse: # Response for initiating signup (before email validation)
      type: object
      properties:
        message:
          type: string
        data: # Contains anonymous token
          $ref: '#/components/schemas/SuccessData'
      required:
        - message
        - data
    ConfigResponseLoggedIn: # Response for /config when user is logged in
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/UserDTO'
            cart:
              $ref: '#/components/schemas/ExtendedCart'
            accessToken:
              type: string
          required:
            - user
            - cart
            - accessToken
    ConfigResponseLoggedOut: # Response for /config when user is logged out/anonymous
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            cart:
              $ref: '#/components/schemas/ExtendedCart' # Could be empty or existing anonymous cart
            accessToken: # Anonymous token
              type: string
          required:
            - cart
            - accessToken
    SignupInput:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
          nullable: true
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        remember:
          type: boolean
          default: false
      required:
        - firstName
        - email
        - password
    VerifyEmailInput:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: The 8-digit verification code from the signup email.
      required:
        - email
        - code
    ResendEmailInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        remember:
          type: boolean
          default: false
      required:
        - email
        - password
    SubmitForgotPasswordEmailInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    ValidateCodeInput:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: The 8-digit verification code.
      required:
        - email
        - code
    ResetPasswordInput:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: The 8-digit verification code.
        password:
          type: string
          format: password
          description: The new password for the user.
      required:
        - email
        - code
        - password

    # ---------- Checkout Schemas ----------
    ClientCheckoutStage: # Structure for stages returned by /checkout/stages GET
      type: object
      properties:
        name:
          type: string
          enum: [personal-details, address, shipping, review]
        isEnabled:
          type: boolean
        title:
          type: string
      required:
        - name
        - isEnabled
        - title
    CheckoutStagesResponse: # Response for GET /checkout/stages
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            availableCheckoutStages:
              type: array
              items:
                $ref: '#/components/schemas/ClientCheckoutStage'
            accessToken:
              type: string
            isCheckoutPossible: # Optional, present if stages cannot be determined due to cart issues
              type: boolean
              description: Indicates if checkout is generally possible (e.g., cart not empty).
      required:
        - message
        - data
    CheckoutStageErrorResponse: # Specific error when a stage is invalid/not enabled
      type: object
      properties:
        message:
          type: string
          example: Address checkout stage is not enabled
        data:
          type: object
          properties:
            availableCheckoutStages:
              type: array
              items:
                $ref: '#/components/schemas/ClientCheckoutStage'
            accessToken:
              type: string
      required:
        - message
        - data
    CheckoutStageInputPersonalDetails:
      type: object
      properties:
        personalDetails:
          $ref: '#/components/schemas/UserDetailsInput'
      required:
        - personalDetails
    CheckoutStageResponsePersonalDetailsGet:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            personalDetails:
              $ref: '#/components/schemas/UserDetails'
              nullable: true # Can be null if not set yet
            availableCheckoutStages:
              type: array
              items:
                $ref: '#/components/schemas/ClientCheckoutStage'
            accessToken:
              type: string
      required:
        - message
        - data
    CheckoutStageResponsePersonalDetailsPost:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            personalDetails:
              $ref: '#/components/schemas/UserDetails'
            availableCheckoutStages:
              type: array
              items:
                $ref: '#/components/schemas/ClientCheckoutStage'
            accessToken:
              type: string
      required:
        - message
        - data
    CheckoutStageInputAddress:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/AddressInput'
        saveAddress:
          type: boolean
          description: If true and user is logged in, save address to profile.
          default: false
      required:
        - address
    CheckoutStageResponseAddressGet:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            address:
              $ref: '#/components/schemas/Address'
              nullable: true
            availableCheckoutStages:
              type: array
              items:
                $ref: '#/components/schemas/ClientCheckoutStage'
            accessToken:
              type: string
      required:
        - message
        - data
    CheckoutStageResponseAddressPost:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            address:
              $ref: '#/components/schemas/Address'
            availableCheckoutStages:
              type: array
              items:
                $ref: '#/components/schemas/ClientCheckoutStage'
            accessToken:
              type: string
      required:
        - message
        - data
    CheckoutStageInputShipping:
      type: object
