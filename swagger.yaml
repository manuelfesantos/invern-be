openapi: 3.0.0
info:
  title: Invern Spirit Backend API
  version: 1.0.0
  description: |
    API documentation for the Invern Spirit ecommerce backend, built with Cloudflare Workers.
    Handles product catalog, user management, shopping cart, checkout, and order processing.

servers:
  - url: http://localhost:8788 # Default wrangler dev port (using http for local)
    description: Local Development Environment
  - url: https://api.invernspirit.com
    description: Production Environment
  - url: https://{preview-id}.invern-be.pages.dev # Placeholder, replace {preview-id} as needed
    description: Preview Environment (Cloudflare Pages Function URL)

tags:
  # Public
  - name: Public - Countries
    description: Operations related to country listing and selection.
  - name: Public - Config
    description: Endpoint to fetch initial configuration (cart, user, tokens).
  - name: Public - Products
    description: Operations related to viewing products.
  - name: Public - Collections
    description: Operations related to viewing product collections.
  - name: Public - Cart
    description: Shopping cart management (anonymous and authenticated users).
  - name: Public - Checkout
    description: Multi-stage checkout process (requires authentication).
  - name: Public - User Auth
    description: User authentication operations (signup, login, logout, forgot password).
  - name: Public - User Profile
    description: User profile management operations (requires authentication).
  - name: Public - Orders
    description: Viewing user orders (requires authentication or guest email).
  - name: Public - OAuth
    description: OAuth related operations (Google).
  # Private (Admin/Internal)
  - name: Private - Currencies
    description: Admin operations for managing currencies. Requires Admin Authentication.
  - name: Private - Countries
    description: Admin operations for managing countries. Requires Admin Authentication.
  - name: Private - Products Admin
    description: Admin operations for managing products. Requires Admin Authentication.
  - name: Private - Collections Admin
    description: Admin operations for managing collections. Requires Admin Authentication.
  - name: Private - Carts Admin # Added
    description: Admin operations for viewing carts. Requires Admin Authentication.
  - name: Private - Users Admin # Added
    description: Admin operations for managing users. Requires Admin Authentication.
  - name: Private - Orders Admin
    description: Admin operations for viewing and managing all orders. Requires Admin Authentication. # Updated Description
  - name: Private - Stock
    description: Internal operations for managing product stock. Requires special auth/intended for specific triggers.
  - name: Private - Test Data
    description: Internal operations for seeding test data. Requires special auth.
  - name: Private - Scheduled Tasks
    description: Endpoints triggered by Cloudflare Cron Triggers or similar mechanisms.
  # Webhooks
  - name: Stripe Webhooks
    description: Webhooks for receiving events from Stripe.

security:
  - AdminBearer: [] # Define a scheme for private endpoints needing a secret key

paths:
  # -------------------- Public - Countries --------------------
  /public/countries:
    get:
      tags:
        - Public - Countries
      summary: Get All Available Countries
      description: Retrieves a list of all countries supported by the store.
      responses:
        '200':
          description: A list of countries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success getting countries
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClientCountry'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}:
    get:
      tags:
        - Public - Countries
      summary: Get Country Details by Code
      description: Retrieves detailed information for a specific country using its ISO 2-letter code (uppercase). Caches results.
      parameters:
        - $ref: '#/components/parameters/CountryCode'
      responses:
        '200':
          description: Detailed information about the country.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Success getting country by code
                  data:
                    $ref: '#/components/schemas/Country' # Full country details
        '400':
          $ref: '#/components/responses/BadRequest' # e.g., Invalid country code format
        '404':
          $ref: '#/components/responses/NotFound' # Country not supported/found
        '500':
          $ref: '#/components/responses/InternalServerError'

  # -------------------- Public - Config --------------------
  /public/countries/{countryCode}/config:
    get:
      tags:
        - Public - Config
      summary: Get Initial API Configuration
      description: |
        Fetches initial data needed for the frontend, including anonymous/logged-in tokens,
        the current shopping cart state (from cookie `c_i` if present), and user details if logged in (validated via `s_r` refresh token cookie).
        Handles refresh token validation and issues new access tokens.
        Cookies (`s_r`, `c_i`, `r_m`, checkout stage cookies) determine the response state.
        The `after-checkout` header influences cookie handling after a successful payment redirect. Sets auth cookies if needed.
      parameters:
        - $ref: '#/components/parameters/CountryCode'
        - name: after-checkout
          in: header
          required: false
          description: Set to 'true' after a successful checkout redirect to clean up session cookies (`c_s`, `a_d`, `u_d`, `s_m`) and potentially set `c_m`.
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: Configuration object containing tokens, cart, and potentially user data. Cookies may be set/deleted.
          content:
            application/json:
              schema:
                oneOf: # Response varies based on auth state
                  - $ref: '#/components/schemas/ConfigResponseLoggedIn'
                  - $ref: '#/components/schemas/ConfigResponseLoggedOut'
          headers:
            Set-Cookie:
              description: May set `s_r` (refresh token), `c_i` (cart ID), `r_m` (remember me), `c_m` (customer email), and delete checkout stage cookies (`a_d`, `u_d`, `s_m`, `c_s`).
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized' # If refresh token validation fails severely
        '404':
          $ref: '#/components/responses/NotFound' # Country not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  # -------------------- Public - Products --------------------
  /public/countries/{countryCode}/products:
    get:
      tags:
        - Public - Products
      summary: Get All Products
      description: Retrieves a list of all available products for the specified country, optionally filtered by a search term. Prices include calculated taxes based on the country.
      parameters:
        - $ref: '#/components/parameters/CountryCode'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: A list of products available in the specified country.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Successfully got products
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExtendedProduct'
        '404':
          $ref: '#/components/responses/NotFound' # Country not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/products/{id}:
    get:
      tags:
        - Public - Products
      summary: Get Product Details
      description: Retrieves detailed information for a specific product by its ID, including calculated taxes and collection details.
      parameters:
        - $ref: '#/components/parameters/CountryCode'
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Detailed information about the product.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Successfully got product
                  data:
                    $ref: '#/components/schemas/ExtendedProductWithCollectionDetails'
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid ID format
        '404':
          $ref: '#/components/responses/NotFound' # Product or Country not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  # -------------------- Public - Collections --------------------
  /public/countries/{countryCode}/collections:
    get:
      tags:
        - Public - Collections
      summary: Get All Collections
      description: Retrieves a list of all product collections for the specified country.
      parameters:
        - $ref: '#/components/parameters/CountryCode'
      responses:
        '200':
          description: A list of product collections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success getting collections
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Collection'
        '404':
          $ref: '#/components/responses/NotFound' # Country not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/collections/{id}:
    get:
      tags:
        - Public - Collections
      summary: Get Collection Details
      description: Retrieves detailed information for a specific collection by its ID, including its products with calculated taxes.
      parameters:
        - $ref: '#/components/parameters/CountryCode'
        - $ref: '#/components/parameters/CollectionId'
      responses:
        '200':
          description: Detailed information about the collection and its products.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success getting collection details
                  data:
                    $ref: '#/components/schemas/ExtendedCollectionDetails'
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid ID format
        '404':
          $ref: '#/components/responses/NotFound' # Collection or Country not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  # -------------------- Public - Cart --------------------
  /public/countries/{countryCode}/cart:
    get:
      tags:
        - Public - Cart
      summary: Get Current Cart
      description: Retrieves the current user's shopping cart (anonymous or logged-in), identified by `c_i` cookie or user session. Includes product details, quantities, calculated prices, taxes, and totals. Issues new anonymous tokens/cart ID if none exist.
      parameters:
        - $ref: '#/components/parameters/CountryCode'
      responses:
        '200':
          description: The user's current shopping cart. May set `s_r` and `c_i` cookies if a new anonymous session is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse' # Includes ExtendedCart and accessToken
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOptional' # May set s_r, c_i
        '404':
          $ref: '#/components/responses/NotFound' # Country not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/cart/items/{id}:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
      - $ref: '#/components/parameters/ProductId'
    patch:
      tags:
        - Public - Cart
      summary: Add Quantity to Cart Item (Patch)
      description: Increases the quantity of an existing item in the cart or adds it if not present. Requires `quantity` > 0. Creates an anonymous cart (`c_i` cookie) if one doesn't exist. Updates `lastModifiedAt` on the cart. Deletes checkout stage cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemQuantityInputPatch' # Minimum 1
      responses:
        '200':
          description: The updated shopping cart. May set `s_r` and `c_i` cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOptional' # Sets checkout stage cookies to empty, may set s_r, c_i
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid quantity (<=0), product out of stock, invalid product ID
        '404':
          $ref: '#/components/responses/NotFound' # Product or Country not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Public - Cart
      summary: Set Cart Item Quantity (Put)
      description: Sets the exact quantity for a product in the cart. Adds the item if not present (requires quantity > 0). Removes the item if quantity is 0. Creates an anonymous cart (`c_i` cookie) if one doesn't exist. Updates `lastModifiedAt` on the cart. Deletes checkout stage cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemQuantityInputPut' # Minimum 0
      responses:
        '200':
          description: The updated shopping cart. May set `s_r` and `c_i` cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOptional' # Sets checkout stage cookies to empty, may set s_r, c_i
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid quantity (negative), product out of stock, invalid product ID
        '404':
          $ref: '#/components/responses/NotFound' # Product or Country not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Public - Cart
      summary: Remove Item From Cart
      description: Removes a specific product entirely from the shopping cart. Requires cart to exist (identified by `c_i` or user session). Updates `lastModifiedAt` on the cart. Deletes checkout stage cookies.
      responses:
        '200':
          description: The updated shopping cart after removal. May set `s_r` cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOptional' # Sets checkout stage cookies to empty, may set s_r
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid product ID, Cart does not exist
        '404':
          $ref: '#/components/responses/NotFound' # Product or Country not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  # -------------------- Public - Checkout --------------------
  /public/countries/{countryCode}/checkout/stages:
    get:
      tags:
        - Public - Checkout
      summary: Get Available Checkout Stages
      description: Retrieves the list of checkout stages and their current enabled status based on the cart and previously completed steps (stored in cookies `u_d`, `a_d`, `s_m`). Requires authentication (access token).
      parameters:
        - $ref: '#/components/parameters/CountryCode'
      responses:
        '200':
          description: List of available checkout stages and their status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStagesResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOptional'
        '400':
          $ref: '#/components/responses/BadRequest' # Cart is empty or has issues preventing checkout
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound' # Country not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/checkout/stages/personal-details:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    get:
      tags:
        - Public - Checkout
      summary: Get Personal Details for Checkout
      description: Retrieves the personal details (email, first/last name) either from cookie `u_d` (guest) or the logged-in user profile. Requires authentication. Fails if this stage is not enabled.
      responses:
        '200':
          description: Personal details for checkout and current stage status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStageResponsePersonalDetailsGet'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOptional'
        '400':
          $ref: '#/components/responses/CheckoutStageNotEnabled'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound' # Country not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Public - Checkout
      summary: Save Personal Details for Checkout (Guest Only)
      description: Saves personal details (email, first/last name) for a guest checkout. Only applicable if user is *not* logged in. Sets the `u_d` cookie (encrypted) and enables the next stage. Requires authentication (anonymous token is sufficient). Fails if this stage is not enabled or user is logged in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutStageInputPersonalDetails'
      responses:
        '200':
          description: Personal details saved, returns updated stage status. Sets `u_d` cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStageResponsePersonalDetailsPost'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookiePersonalDetails'
        '400':
          $ref: '#/components/responses/CheckoutStageNotEnabledOrBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden - Cannot set guest details when logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound' # Country not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/checkout/stages/address:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    get:
      tags:
        - Public - Checkout
      summary: Get Address for Checkout
      description: Retrieves the shipping address from cookie `a_d` (guest) or the logged-in user's saved profile address. Requires authentication. Fails if this stage is not enabled.
      responses:
        '200':
          description: Address details and stage status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStageResponseAddressGet'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOptional'
        '400':
          $ref: '#/components/responses/CheckoutStageNotEnabled'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound' # Country not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Public - Checkout
      summary: Save Address for Checkout
      description: Saves the shipping address. Sets the `a_d` cookie (encrypted). Optionally saves to the user profile if logged in and `saveAddress` is true. Enables the next stage. Requires authentication. Fails if this stage is not enabled or address country doesn't match path country.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutStageInputAddress'
      responses:
        '200':
          description: Address saved, returns updated stage status. Sets `a_d` cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStageResponseAddressPost'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieAddress'
        '400':
          $ref: '#/components/responses/CheckoutStageNotEnabledOrBadRequest' # Also for country mismatch
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound' # Country not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/checkout/stages/shipping:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    get:
      tags:
        - Public - Checkout
      summary: Get Available Shipping Methods
      description: Retrieves available shipping methods based on cart weight and destination country. Returns the currently selected method if `s_m` cookie is set. Requires authentication. Fails if this stage is not enabled.
      responses:
        '200':
          description: List of shipping methods and stage status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStageResponseShippingGet'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOptional'
        '400':
          $ref: '#/components/responses/CheckoutStageNotEnabledOrBadRequest' # Also for cart invalid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound' # No suitable shipping methods/rates found or country not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Public - Checkout
      summary: Select Shipping Method
      description: Selects a shipping method/rate by its ID (must be a valid rate for the current cart/country). Sets the `s_m` cookie (encrypted shipping *method* ID). Enables the next stage. Requires authentication. Fails if this stage is not enabled or rate is invalid/not applicable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutStageInputShipping' # ID of the shipping *method*
      responses:
        '200':
          description: Shipping method selected, returns updated stage status. Sets `s_m` cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStageResponseShippingPost'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieShipping'
        '400':
          $ref: '#/components/responses/CheckoutStageNotEnabledOrBadRequest' # Also for invalid input/rate not applicable
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound' # Shipping method/rate not found or country not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/checkout/stages/review:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    get:
      tags:
        - Public - Checkout
      summary: Get Checkout Review
      description: Retrieves a summary of the order (cart items, personal details, address, selected shipping) before proceeding to payment. Requires authentication. Fails if this stage is not enabled or preceding stages are incomplete.
      responses:
        '200':
          description: Order review details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStageResponseReviewGet'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOptional'
        '400':
          $ref: '#/components/responses/CheckoutStageNotEnabledOrBadRequest' # Also for preceding stages incomplete
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound' # Country not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/checkout/stages/payment:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    get:
      tags:
        - Public - Checkout
      summary: Get Payment Session URL
      description: Creates a Stripe Checkout session and returns the URL to redirect the user for payment. Reserves stock. Sets the `c_s` cookie (encrypted checkout session ID). Requires authentication and all previous checkout stages to be complete. Fails if the review stage is not enabled or cart has issues (e.g., stock).
      responses:
        '200':
          description: Stripe Checkout session URL. Sets `c_s` cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStageResponsePaymentGet'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieCheckoutSession'
        '400':
          $ref: '#/components/responses/CheckoutStageNotEnabledOrBadRequest' # Also for preceding stages incomplete/invalid cart state/stock issues
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound' # Country not found
        '500':
          $ref: '#/components/responses/InternalServerError' # Stripe API error, stock reservation issues

  # -------------------- Public - User Auth --------------------
  /public/countries/{countryCode}/user/signup:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    post:
      tags:
        - Public - User Auth
      summary: User Signup
      description: Creates a new, initially unvalidated user account. Sends a validation email. Fails if user is already logged in or email is taken by a validated user. If email exists but is unvalidated/OAuth, updates the record. Associates anonymous cart (`c_i` cookie) if present. Returns success message, requires email validation to complete login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupInput'
      responses:
        '200':
          description: Signup initiated, validation email sent. Returns anonymous tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse' # Contains message and anonymous accessToken
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieAnonymous' # Sets anonymous s_r, deletes c_i and checkout cookies
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid input data
        '401':
          $ref: '#/components/responses/Unauthorized' # User already logged in
        '409':
          $ref: '#/components/responses/Conflict' # Email already taken by a validated, non-OAuth user
        '500':
          $ref: '#/components/responses/InternalServerError' # Email sending or DB error

  /public/countries/{countryCode}/user/signup/verify-email:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    post:
      tags:
        - Public - User Auth
      summary: Verify Signup Email
      description: Validates the code sent during signup. If valid, marks the user as validated, logs them in, and returns user data, cart, and auth tokens/cookies. Deletes validation secret from KV.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailInput'
      responses:
        '200':
          description: Email verified, user logged in. Returns user data, cart, and tokens. Sets auth cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieAuth' # Sets s_r, r_m, deletes c_i, checkout cookies
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid input
        '401':
          description: Invalid or expired code, or too many attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound' # User or code not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/user/signup/resend-email:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    post:
      tags:
        - Public - User Auth
      summary: Resend Signup Verification Email
      description: Resends the verification email if the user exists, is unvalidated, and hasn't exceeded the resend limit. Uses the existing code stored in KV.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEmailInput'
      responses:
        '200':
          description: Verification email resent successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse' # Contains message and anonymous accessToken
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieAnonymous' # May refresh anonymous s_r
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid input
        '401':
          description: Too many resend attempts or code expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound' # User or original code not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/user/login:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    post:
      tags:
        - Public - User Auth
      summary: User Login
      description: Logs in an existing, validated user with email and password. Returns user data, cart, and new auth tokens/cookies. Merges anonymous cart (`c_i` cookie) if present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: User successfully logged in. Returns user data, cart, and tokens. Sets auth cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieAuth' # Sets s_r, r_m, deletes c_i, checkout cookies
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid input data
        '401':
          description: Invalid credentials or user not validated/already logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/user/logout:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    post:
      tags:
        - Public - User Auth
      summary: User Logout
      description: Logs out the current user. Invalidates the refresh token server-side (by deleting from KV). Returns anonymous tokens and an empty cart representation. Requires authentication. Deletes auth cookies.
      responses:
        '200':
          description: User successfully logged out. Returns anonymous tokens and empty cart. Deletes auth cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieLogout'
        '401':
          $ref: '#/components/responses/Unauthorized' # User not logged in
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/user/forgot-password/submit-email:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    post:
      tags:
        - Public - User Auth
      summary: Submit Forgot Password Email
      description: Initiates the password reset process. Sends an email with a verification code to the user if the email exists and is validated. Creates/updates KV entry with code, expiry, attempts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitForgotPasswordEmailInput'
      responses:
        '200':
          description: Email sent successfully (or process initiated; avoids user enumeration). Returns anonymous tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email sent successfully
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieAnonymous'
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid email format
        '401':
          description: Too many requests (code exhausted) for this email recently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found or not validated (Response is 200 to prevent enumeration, but internally no email sent).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email sent successfully
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/user/forgot-password/validate-code:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    post:
      tags:
        - Public - User Auth
      summary: Validate Forgot Password Code
      description: Validates the verification code sent via email against the entry in KV. Decrements attempts on failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCodeInput'
      responses:
        '200':
          description: Code validated successfully. Returns anonymous tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Code validated successfully
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieAnonymous'
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid input
        '401':
          description: Invalid or expired code, or too many attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound' # Code not found (likely expired and deleted or never existed)
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/user/forgot-password/reset:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    post:
      tags:
        - Public - User Auth
      summary: Reset Password
      description: Resets the user's password using a validated code. Requires email, code, and new password. Validates code against KV again, then updates user password hash and deletes KV entry. Invalidates existing refresh token by creating a new one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordInput'
      responses:
        '200':
          description: Password reset successfully. Returns anonymous tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset successfully
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieAnonymous'
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid input
        '401':
          description: Invalid or expired code, or too many attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound' # User or code not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  # -------------------- Public - User Profile --------------------
  /public/countries/{countryCode}/user:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    get:
      tags:
        - Public - User Profile
      summary: Get User Profile
      description: Retrieves the profile information (email, name, address) for the currently authenticated user. Requires authentication.
      responses:
        '200':
          description: User profile data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOptional'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound' # User record somehow missing
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Public - User Profile
      summary: Delete User Account
      description: Permanently deletes the authenticated user's account and associated data (cart, orders might be kept or anonymized based on policy). Invalidates tokens. Requires authentication. Returns anonymous tokens.
      responses:
        '200':
          description: User account successfully deleted. Returns anonymous tokens. Deletes auth cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieLogout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/user/update/personal-information:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    post:
      tags:
        - Public - User Profile
      summary: Update User Personal Information
      description: Updates the authenticated user's first name, last name, and/or address. Requires authentication. Address country must match path country.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonalInformationInput'
      responses:
        '200':
          description: Personal information successfully updated. Returns updated user profile data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOptional'
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid input data or address country mismatch
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound' # User not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/user/update/password:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    post:
      tags:
        - Public - User Profile
      summary: Update User Password
      description: Updates the authenticated user's password. Requires current password for verification. Requires authentication. Invalidates existing refresh token by creating a new one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordInput'
      responses:
        '200':
          description: Password successfully updated. Returns updated user profile data and new tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse' # Contains user DTO and new accessToken
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieAuth' # Sets new s_r
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid input data
        '401':
          $ref: '#/components/responses/Unauthorized' # Incorrect current password or not logged in
        '404':
          $ref: '#/components/responses/NotFound' # User not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/user/update/email/submit:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    post:
      tags:
        - Public - User Profile
      summary: Submit Email Change Request
      description: Initiates the process to change the authenticated user's email. Sends a verification code to the *new* email address. Requires authentication. Stores the new email and code temporarily (e.g., in KV).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitEmailChangeInput'
      responses:
        '200':
          description: Verification email sent to the new address. Returns current user profile data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserResponse' # Contains current user DTO and accessToken
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOptional'
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid input email format
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict' # New email address is already taken
        '500':
          $ref: '#/components/responses/InternalServerError' # KV or email sending error

  /public/countries/{countryCode}/user/update/email/validate-code:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    post:
      tags:
        - Public - User Profile
      summary: Validate Email Change Code
      description: Validates the code sent to the new email address. If valid, updates the user's email in the database and deletes the temporary validation secret. Requires authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateEmailChangeCodeInput'
      responses:
        '200':
          description: Email successfully updated. Returns updated user profile data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOptional'
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid input
        '401':
          description: Invalid or expired code, or too many attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound' # User or code not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  # -------------------- Public - Orders --------------------
  /public/countries/{countryCode}/orders:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    get:
      tags:
        - Public - Orders
      summary: Get User Orders
      description: Retrieves a list of past orders for the authenticated user. Requires authentication.
      responses:
        '200':
          description: A list of the user's orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserOrdersResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOptional'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound' # User has no orders, or user not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
      - $ref: '#/components/parameters/OrderId'
      - name: x-user-email # Optional header for guest access
        in: header
        required: false
        description: Email address for guest order lookup (alternative to cookie `c_m`). Used only if user is not authenticated via JWT.
        schema:
          type: string
          format: email
    get:
      tags:
        - Public - Orders
      summary: Get Order Details
      description: Retrieves detailed information for a specific order by its ID. Requires authentication (either logged-in user matching order OR guest providing matching email via `x-user-email` header or `c_m` cookie). Sets `c_m` cookie if email header was used successfully.
      responses:
        '200':
          description: Detailed information about the order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOptionalOrCustomerEmail'
        '401':
          $ref: '#/components/responses/Unauthorized' # User doesn't own order / Email doesn't match or not provided for guest
        '404':
          $ref: '#/components/responses/NotFound' # Order not found
        '422':
          description: Unprocessable Entity - Email required for guest lookup but not provided via header or cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # -------------------- Public - OAuth --------------------
  /public/countries/{countryCode}/oauth/google/redirect:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    get:
      tags:
        - Public - OAuth
      summary: Get Google OAuth Redirect URL
      description: Generates the URL to redirect the user to Google for authentication. Sets an `o_t` cookie (HttpOnly, Secure, SameSite=Lax) for state validation.
      responses:
        '200':
          description: Returns the Google OAuth URL. Sets `o_t` cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthRedirectResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieOAuthToken'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/countries/{countryCode}/oauth/google/callback:
    parameters:
      - $ref: '#/components/parameters/CountryCode' # Note: Country code in path might be ignored if state parameter overrides it
      - name: code
        in: query
        required: true
        description: Authorization code from Google.
        schema:
          type: string
      - name: state
        in: query
        required: true
        description: State parameter containing original country and OAuth token, JSON stringified.
        schema:
          type: string
          example: '{"country":"pt","oauthToken":"..."}'
    get:
      tags:
        - Public - OAuth
      summary: Handle Google OAuth Callback
      description: Handles the callback from Google after successful authentication. Validates state against `o_t` cookie, exchanges code for tokens, retrieves user info, logs in or signs up the user, and returns auth tokens/cookies.
      responses:
        '200':
          description: User successfully authenticated via Google. Returns tokens. Sets auth cookies. Deletes `o_t` cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthCallbackResponse' # Contains accessToken
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieAuthAndOAuthDelete' # Sets s_r and r_m, deletes o_t
        '400':
          $ref: '#/components/responses/BadRequest' # Missing code or state, or invalid state JSON
        '401':
          $ref: '#/components/responses/Unauthorized' # Invalid state/token mismatch from cookie
        '404':
          $ref: '#/components/responses/NotFound' # Google user info not found after successful code exchange
        '500':
          $ref: '#/components/responses/InternalServerError' # Error communicating with Google or DB issues

  # -------------------- Private - Currencies --------------------
  /private/currencies:
    security:
      - AdminBearer: []
    get:
      tags:
        - Private - Currencies
      summary: Get All Currencies (Admin)
      description: >-
        Retrieves a paginated list of currencies. Supports sorting and
        filtering; the response `total` reflects any applied filter. Requires
        Admin Authentication.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/SortOrderParam'
        - name: sortBy
          in: query
          required: false
          description: Field to sort by (allow-listed; other values → 400).
          schema:
            type: string
            enum: [name, code, rateToEuro, createdAt]
        - name: name
          in: query
          required: false
          description: Filter to currencies whose name contains this term.
          schema:
            type: string
        - name: code
          in: query
          required: false
          description: Filter to currencies whose code contains this term.
          schema:
            type: string
      responses:
        '200':
          description: A list of currencies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Currency' # Full currency details including rateToEuro
        '401':
          $ref: '#/components/responses/Unauthorized' # Invalid admin auth
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Private - Currencies
      summary: Add New Currency (Admin)
      description: Adds a new currency to the system. Requires Admin Authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertCurrency'
      responses:
        '200': # Using 200 as per existing patterns, could be 201
          description: Currency successfully created. Returns the created currency.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Currency'
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid input data
        '401':
          $ref: '#/components/responses/Unauthorized' # Invalid admin auth
        '409':
          $ref: '#/components/responses/Conflict' # Currency code already exists
        '500':
          $ref: '#/components/responses/InternalServerError'

  /private/currencies/{code}:
    security:
      - AdminBearer: []
    parameters:
      - name: code
        in: path
        required: true
        description: ISO 3-letter currency code (e.g., EUR, USD).
        schema:
          type: string
          example: EUR
    get:
      tags:
        - Private - Currencies
      summary: Get Currency by Code (Admin)
      description: Retrieves details for a specific currency. Requires Admin Authentication.
      responses:
        '200':
          description: Currency details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Currency'
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid code format
        '401':
          $ref: '#/components/responses/Unauthorized' # Invalid admin auth
        '404':
          $ref: '#/components/responses/NotFound' # Currency not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Private - Currencies
      summary: Update Currency (Admin)
      description: Updates details for an existing currency. Requires Admin Authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertCurrency' # Use Insert schema for update payload
      responses:
        '200':
          description: Currency successfully updated. Returns the updated currency.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Currency'
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid input data
        '401':
          $ref: '#/components/responses/Unauthorized' # Invalid admin auth
        '404':
          $ref: '#/components/responses/NotFound' # Currency not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Private - Currencies
      summary: Delete Currency (Admin)
      description: Deletes a currency from the system. Requires Admin Authentication. Be cautious as this might break associations.
      responses:
        '200':
          description: Currency successfully deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest' # Invalid code format
        '401':
          $ref: '#/components/responses/Unauthorized' # Invalid admin auth
        '404':
          $ref: '#/components/responses/NotFound' # Currency not found
        '500':
          $ref: '#/components/responses/InternalServerError'

